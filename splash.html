<!doctype html>

<!-- R6-15: lang 属性不再硬编码，由下方 inline script 根据系统语言动态设置。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- R6-18: 添加与 index.html/studio.html 一致的 CSP，防止 splash 页加载外部资源。
         R6-15: 为支持 splash 内联 lang 注入脚本，script-src 增加 'unsafe-inline'。
         splash 为 sandbox 窗口（无外部资源加载此页面），风险可控。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:*; media-src 'self' data: blob: http://127.0.0.1:*;" />
    <title>AgentSkin</title>
    <!-- R6-15: 根据系统语言动态设置 <html> lang 属性。
         硬编码 lang="zh-CN" 不随用户切换界面语言变化，导致 screen reader 发音规则错误。
         使用 navigator.language（Electron 中反映系统语言），主窗口加载后的语言偏好
         会在 main window 中通过 i18n 模块处理。 -->
    <script>
      try {
        const sysLang = (navigator.language || 'zh-CN').toLowerCase();
        // 标准化为 zh-CN / en-US 等 BCP 47 格式（Electron 的 navigator.language 已符合）
        document.documentElement.lang = sysLang.startsWith('zh') ? 'zh-CN' : (sysLang.startsWith('en') ? 'en-US' : sysLang);
      } catch (_e) { /* ignore — lang attribute fallback to zh-CN */ }
      // 2026-09-07 主题同步：main.ts 创建 splash 时经 loadFile query 传入持久化的
      // 主题模式（dark 默认），让开场画面与主窗口首屏色调一致，交叉淡入不再跳色。
      try {
        const mode = new URLSearchParams(location.search).get('mode');
        document.documentElement.classList.toggle('light', mode === 'light');
        document.documentElement.style.colorScheme = mode === 'light' ? 'light' : 'dark';
      } catch (_e) { /* ignore — dark is the default */ }
    </script>
    <style>
      /* ================================================================
         AgentSkin splash — 与主窗口同一套视觉语言：
           dark  : --background #0a0a0d / card #16161c / brand #e11d48
           light : --background #f7f7f8 / card #ffffff / brand #e11d48
         窗口本身透明 + 无边框，内容是一张圆角卡片（与主窗口的浮层卡片
         质感一致）；淡出时序由 main.ts fadeOutSplash 驱动（150ms + 50ms）。
         ================================================================ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: transparent; user-select: none;
        font-family: "Inter Variable", "Inter", "Microsoft YaHei UI", "PingFang SC",
          -apple-system, "Segoe UI", system-ui, sans-serif;
      }

      :root {
        --sp-card: linear-gradient(180deg, #121218 0%, #0a0a0d 100%);
        --sp-border: rgba(255, 255, 255, 0.08);
        --sp-title: #f5f5f7;
        --sp-muted: rgba(245, 245, 247, 0.52);
        --sp-track: rgba(255, 255, 255, 0.07);
        --sp-fill-a: #e11d48;
        --sp-fill-b: #fb3658;
        --sp-glow: rgba(225, 29, 72, 0.14);
        --sp-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
        --sp-tile-shadow: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.5));
      }
      html.light {
        --sp-card: linear-gradient(180deg, #ffffff 0%, #f7f7f8 100%);
        --sp-border: rgba(15, 23, 42, 0.08);
        --sp-title: #18181b;
        --sp-muted: rgba(24, 24, 27, 0.55);
        --sp-track: rgba(0, 0, 0, 0.08);
        --sp-glow: rgba(225, 29, 72, 0.10);
        --sp-shadow: 0 24px 64px rgba(15, 23, 42, 0.16);
        --sp-tile-shadow: drop-shadow(0 8px 22px rgba(15, 23, 42, 0.14));
      }

      body {
        transition: opacity 0.18s ease-out;
      }
      body.fade-out { opacity: 0; }

      .splash {
        position: relative;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; width: 100%; height: 100%;
        background: var(--sp-card);
        border: 1px solid var(--sp-border);
        border-radius: 20px;
        box-shadow: var(--sp-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        overflow: hidden;
        animation: card-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      html.light .splash {
        box-shadow: var(--sp-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      /* 顶部玫瑰色环境光 — 对应应用 --accent 的品牌氛围 */
      .splash::before {
        content: "";
        position: absolute; top: -120px; left: 50%;
        width: 360px; height: 240px; transform: translateX(-50%);
        background: radial-gradient(ellipse at center, var(--sp-glow) 0%, transparent 68%);
        pointer-events: none;
      }

      /* ── 品牌区 ─────────────────────────────────────────────── */
      .logo-wrap {
        position: relative; width: 84px; height: 84px;
        margin-bottom: 22px;
        animation: rise-in 560ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* 品牌红环境晕 — 呼吸 */
      .logo-wrap::before {
        content: "";
        position: absolute; inset: -26px;
        background: radial-gradient(circle, var(--sp-glow) 0%, transparent 70%);
        animation: breathe 2.8s ease-in-out infinite;
      }
      .logo {
        position: relative;
        width: 84px; height: 84px;
        filter: var(--sp-tile-shadow);
        animation: tile-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* 白色圆角方块外的一次性扩散环（入场仪式感） */
      .logo::after {
        content: "";
        position: absolute; inset: -1px;
        border-radius: 12px;
        border: 1.5px solid rgba(225, 29, 72, 0.55);
        animation: ring 900ms cubic-bezier(0.22, 1, 0.36, 1) 320ms both;
        pointer-events: none;
      }

      .title {
        position: relative;
        font-size: 19px; font-weight: 600; color: var(--sp-title);
        letter-spacing: 2px;
        margin-bottom: 10px;
        animation: rise-in 560ms cubic-bezier(0.22, 1, 0.36, 1) 100ms both;
      }
      .status {
        position: relative;
        font-size: 12px; color: var(--sp-muted); min-height: 18px;
        animation: fade-in 480ms ease-out 200ms both;
      }

      /* ── 进度区 ─────────────────────────────────────────────── */
      .progress-row {
        position: relative;
        display: flex; align-items: center; gap: 10px;
        width: 220px; margin-top: 18px;
        animation: rise-in 560ms cubic-bezier(0.22, 1, 0.36, 1) 260ms both;
      }
      .progress-bar {
        flex: 1; height: 3px;
        background: var(--sp-track); border-radius: 2px; overflow: hidden;
      }
      .progress-fill {
        position: relative;
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--sp-fill-a), var(--sp-fill-b));
        border-radius: 2px;
        box-shadow: 0 0 10px rgba(225, 29, 72, 0.35);
      }
      /* 高光扫过 — 呼应应用 as-brand-line 的渐变强调 */
      .progress-fill::after {
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%);
        animation: shimmer 1.7s linear infinite;
      }
      .pct {
        font-size: 11px; color: var(--sp-muted);
        font-variant-numeric: tabular-nums;
        min-width: 34px; text-align: right;
      }

      /* ── 动画 ───────────────────────────────────────────────── */
      @keyframes card-in {
        from { opacity: 0; transform: scale(0.985); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes rise-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes tile-in {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes ring {
        from { opacity: 0.9; transform: scale(1); }
        to   { opacity: 0;   transform: scale(1.35); }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50%      { opacity: 1;    transform: scale(1.04); }
      }
      @keyframes shimmer {
        from { transform: translateX(-100%); }
        to   { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash, .logo-wrap, .logo, .logo::after, .title, .status, .progress-row {
          animation: none !important;
        }
        .progress-fill::after { animation: none !important; opacity: 0; }
        .logo-wrap::before { animation: none !important; opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo-wrap">
        <div class="logo">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none" width="100%" height="100%">
            <title>AgentSkin</title>
            <!-- AgentSkin 品牌 mark — 白色圆角方块 + 红色 "A" 单字（与
                 src/ui/components/logo.tsx 完全一致，rx=11.5）。 -->
            <rect x="1" y="1" width="46" height="46" rx="11.5" fill="#FFFFFF" />
            <path d="M24 8.5L39.5 39.5h-7.6L24 22.4l-7.9 17.1H8.5Z" fill="#E30613" />
            <path d="M20 30.1h8l1.5 3.5H18.5Z" fill="#E30613" />
            <path d="M24 8.5L27 14.6 24 13.2 21 14.6Z" fill="#FF6B61" />
          </svg>
        </div>
      </div>
      <div class="title">AgentSkin</div>
      <!-- R6-19: "Loading..." 硬编码英文，与默认中文 locale 不匹配，改为中文文案。 -->
      <div class="status" id="status">加载中...</div>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="pct" id="pct">0%</div>
      </div>
    </div>
    <script>
      const statusEl = document.getElementById('status');
      const progressEl = document.getElementById('progress');
      const pctEl = document.getElementById('pct');
      let currentDisplayedPct = 0;
      let targetPct = 0;

      // Smoothly ease the bar toward the target every frame instead of jumping
      // to each reported value — the main process reports progress at irregular
      // intervals, and a light easing hides frame-to-frame jitter. The rate is
      // kept aggressive enough that the bar tracks the real loading progress
      // (it must not feel like a decorative filler that runs on its own timer).
      function animateProgress() {
        if (currentDisplayedPct !== targetPct) {
          const diff = targetPct - currentDisplayedPct;
          // Move at least 0.8% per frame, and up to 30% of the remaining gap —
          // fast enough to reflect real work, slow enough to avoid hard snaps.
          const step = Math.max(0.8, Math.abs(diff) * 0.3);
          currentDisplayedPct += diff > 0 ? step : -step;
          // Clamp to avoid overshoot past the target.
          if (
            (diff > 0 && currentDisplayedPct > targetPct) ||
            (diff < 0 && currentDisplayedPct < targetPct)
          ) {
            currentDisplayedPct = targetPct;
          }
          const shown = Math.round(currentDisplayedPct);
          progressEl.style.width = `${currentDisplayedPct}%`;
          pctEl.textContent = `${shown}%`;
        }
        requestAnimationFrame(animateProgress);
      }
      animateProgress();

      if (window.splashApi && typeof window.splashApi.onSplashProgress === 'function') {
        window.splashApi.onSplashProgress((data) => {
          if (data.label) statusEl.textContent = data.label;
          // Set the target; animateProgress eases toward it each frame.
          if (data.pct != null) targetPct = data.pct;
          // Fade-out signal: main process sends fadeOut: true when the
          // boot sequence is complete and the main window is ready.
          if (data.fadeOut) {
            document.body.classList.add('fade-out');
          }
        });
      }
    </script>
  </body>
</html>
