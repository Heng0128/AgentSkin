<!doctype html>

<!-- R6-15: lang 属性不再硬编码，由下方 inline script 根据系统语言动态设置。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- R6-18: 添加与 index.html/studio.html 一致的 CSP，防止 splash 页加载外部资源。
         R6-15: 为支持 splash 内联 lang 注入脚本，script-src 增加 'unsafe-inline'。
         splash 为 sandbox 窗口（无外部资源加载此页面），风险可控。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:*; media-src 'self' data: blob: http://localhost:* http://127.0.0.1:*;" />
    <title>AgentSkin</title>
    <!-- R6-15: 根据系统语言动态设置 <html> lang 属性。
         硬编码 lang="zh-CN" 不随用户切换界面语言变化，导致 screen reader 发音规则错误。
         使用 navigator.language（Electron 中反映系统语言），主窗口加载后的语言偏好
         会在 main window 中通过 i18n 模块处理。 -->
    <script>
      try {
        const sysLang = (navigator.language || 'zh-CN').toLowerCase();
        // 标准化为 zh-CN / en-US 等 BCP 47 格式（Electron 的 navigator.language 已符合）
        document.documentElement.lang = sysLang.startsWith('zh') ? 'zh-CN' : (sysLang.startsWith('en') ? 'en-US' : sysLang);
      } catch (e) { /* ignore — lang attribute fallback to zh-CN */ }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0f0a2e; user-select: none;
        font-family: 'Microsoft YaHei UI', 'Segoe UI', sans-serif;
      }
      .splash {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; width: 100%; height: 100%;
        background: radial-gradient(ellipse at 50% 35%, #1a1530 0%, #0f0a2e 50%, #0a0a0f 100%);
      }
      .logo-wrap {
        position: relative; width: 96px; height: 96px; margin-bottom: 32px;
        animation: pulse 2s ease-in-out infinite;
      }
      .logo-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 0 20px rgba(91,196,232,0.3)); }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.92; }
      }
      .spinner {
        width: 28px; height: 28px; margin-bottom: 20px;
        border: 3px solid rgba(167,139,250,0.2);
        border-top-color: #5BC4E8; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .title {
        font-size: 20px; font-weight: 300; color: #e0e0e0;
        letter-spacing: 6px; margin-bottom: 8px; text-transform: lowercase;
      }
      .status {
        font-size: 12px; color: #6b7280; min-height: 18px;
        transition: opacity 0.3s;
      }
      .progress-bar {
        width: 200px; height: 3px; margin-top: 16px;
        background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden;
      }
      .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #5B3FA0, #4A6FC8, #3AA8D4);
        border-radius: 2px; transition: width 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo-wrap">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splashRing1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7B5EA7"/>
              <stop offset="100%" stop-color="#5B3FA0"/>
            </linearGradient>
            <linearGradient id="splashRing2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6B8FD8"/>
              <stop offset="100%" stop-color="#4A6FC8"/>
            </linearGradient>
            <linearGradient id="splashRing3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#5BC4E8"/>
              <stop offset="100%" stop-color="#3AA8D4"/>
            </linearGradient>
            <filter id="splashGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g transform="translate(256, 256)">
            <circle cx="0" cy="0" r="140" fill="none" stroke="url(#splashRing1)" stroke-width="12"
                    stroke-dasharray="660 220" stroke-dashoffset="0"
                    stroke-linecap="round" opacity="0.9"/>
            <circle cx="0" cy="0" r="105" fill="none" stroke="url(#splashRing2)" stroke-width="10"
                    stroke-dasharray="495 165" stroke-dashoffset="-220"
                    stroke-linecap="round" opacity="0.85" transform="rotate(120)"/>
            <circle cx="0" cy="0" r="70" fill="none" stroke="url(#splashRing3)" stroke-width="8"
                    stroke-dasharray="330 110" stroke-dashoffset="-440"
                    stroke-linecap="round" opacity="0.8" transform="rotate(240)"/>
            <circle cx="0" cy="0" r="6" fill="#5BC4E8" filter="url(#splashGlow)"/>
          </g>
        </svg>
      </div>
      <div class="title">AgentSkin</div>
      <div class="spinner"></div>
      <!-- R6-19: "Loading..." 硬编码英文，与默认中文 locale 不匹配，改为中文文案。 -->
      <div class="status" id="status">加载中...</div>
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>
    <script>
      const statusEl = document.getElementById('status');
      const progressEl = document.getElementById('progress');
      if (window.splashApi && typeof window.splashApi.onSplashProgress === 'function') {
        window.splashApi.onSplashProgress((data) => {
          if (data.label) statusEl.textContent = data.label;
          if (data.pct != null) progressEl.style.width = data.pct + '%';
        });
      }
    </script>
  </body>
</html>
