<!doctype html>

<!-- R6-15: lang 属性不再硬编码，由下方 inline script 根据系统语言动态设置。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- R6-18: 添加与 index.html/studio.html 一致的 CSP，防止 splash 页加载外部资源。
         R6-15: 为支持 splash 内联 lang 注入脚本，script-src 增加 'unsafe-inline'。
         splash 为 sandbox 窗口（无外部资源加载此页面），风险可控。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:*; media-src 'self' data: blob: http://127.0.0.1:*;" />
    <title>AgentSkin</title>
    <!-- R6-15: 根据系统语言动态设置 <html> lang 属性。
         硬编码 lang="zh-CN" 不随用户切换界面语言变化，导致 screen reader 发音规则错误。
         使用 navigator.language（Electron 中反映系统语言），主窗口加载后的语言偏好
         会在 main window 中通过 i18n 模块处理。 -->
    <script>
      try {
        const sysLang = (navigator.language || 'zh-CN').toLowerCase();
        // 标准化为 zh-CN / en-US 等 BCP 47 格式（Electron 的 navigator.language 已符合）
        document.documentElement.lang = sysLang.startsWith('zh') ? 'zh-CN' : (sysLang.startsWith('en') ? 'en-US' : sysLang);
      } catch (_e) { /* ignore — lang attribute fallback to zh-CN */ }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: transparent; user-select: none;
        font-family: 'Microsoft YaHei UI', 'Segoe UI', sans-serif;
        transition: opacity 0.15s ease-out;
      }
      body.fade-out {
        opacity: 0;
      }
      .splash {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; width: 100%; height: 100%;
        /* Warm cream radial — matches the light-theme `--background`
           (hsl(40 12% 96%)) so the white-square brand mark sits naturally
           instead of floating like a foreign tile on a black field.
           A subtle red-tinted glow keeps the brand accent present without
           making the splash feel saturated. The cross-fade into the dark
           main window is handled in main.ts (150ms). */
        background:
          radial-gradient(ellipse at 50% 28%, rgba(227, 6, 19, 0.05) 0%, rgba(227, 6, 19, 0) 55%),
          radial-gradient(ellipse at 50% 30%, #FCF9F4 0%, #F4EFE6 48%, #ECE5D9 100%);
      }
      .logo {
        width: 88px; height: 88px; margin-bottom: 28px;
        filter: drop-shadow(0 8px 20px rgba(20, 16, 10, 0.10))
                drop-shadow(0 2px 4px rgba(20, 16, 10, 0.08));
      }
      .title {
        font-size: 20px; font-weight: 600; color: #1f2024;
        letter-spacing: 2px; margin-bottom: 8px;
      }
      .status {
        font-size: 12px; color: #6b6e78; min-height: 18px;
      }
      .progress-bar {
        width: 200px; height: 3px; margin-top: 16px;
        background: rgba(31, 32, 36, 0.08); border-radius: 2px; overflow: hidden;
      }
      .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #e30613, #ff6b61);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none">
          <title>AgentSkin</title>
          <!-- AgentSkin 品牌 mark — 白色圆角方块 + 红色 "A" 单字（与
               src/ui/components/logo.tsx 完全一致）。 -->
          <rect x="1" y="1" width="46" height="46" rx="11.5" fill="#FFFFFF" />
          <path d="M24 8.5L39.5 39.5h-7.6L24 22.4l-7.9 17.1H8.5Z" fill="#E30613" />
          <path d="M20 30.1h8l1.5 3.5H18.5Z" fill="#E30613" />
          <path d="M24 8.5L27 14.6 24 13.2 21 14.6Z" fill="#FF6B61" />
        </svg>
      </div>
      <div class="title">AgentSkin</div>
      <!-- R6-19: "Loading..." 硬编码英文，与默认中文 locale 不匹配，改为中文文案。 -->
      <div class="status" id="status">加载中...</div>
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>
    <script>
      const statusEl = document.getElementById('status');
      const progressEl = document.getElementById('progress');
      let currentDisplayedPct = 0;
      let targetPct = 0;

      // Smoothly ease the bar toward the target every frame instead of jumping
      // to each reported value — the main process reports progress at irregular
      // intervals, and a light easing hides frame-to-frame jitter. The rate is
      // kept aggressive enough that the bar tracks the real loading progress
      // (it must not feel like a decorative filler that runs on its own timer).
      function animateProgress() {
        if (currentDisplayedPct !== targetPct) {
          const diff = targetPct - currentDisplayedPct;
          // Move at least 0.8% per frame, and up to 30% of the remaining gap —
          // fast enough to reflect real work, slow enough to avoid hard snaps.
          const step = Math.max(0.8, Math.abs(diff) * 0.3);
          currentDisplayedPct += diff > 0 ? step : -step;
          // Clamp to avoid overshoot past the target.
          if (
            (diff > 0 && currentDisplayedPct > targetPct) ||
            (diff < 0 && currentDisplayedPct < targetPct)
          ) {
            currentDisplayedPct = targetPct;
          }
          progressEl.style.width = `${currentDisplayedPct}%`;
        }
        requestAnimationFrame(animateProgress);
      }
      animateProgress();

      if (window.splashApi && typeof window.splashApi.onSplashProgress === 'function') {
        window.splashApi.onSplashProgress((data) => {
          if (data.label) statusEl.textContent = data.label;
          // Set the target; animateProgress eases toward it each frame.
          if (data.pct != null) targetPct = data.pct;
          // Fade-out signal: main process sends fadeOut: true when the
          // boot sequence is complete and the main window is ready.
          if (data.fadeOut) {
            document.body.classList.add('fade-out');
          }
        });
      }
    </script>
  </body>
</html>
