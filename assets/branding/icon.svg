<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AgentSkin app icon</title>
  <desc id="desc">Three fanned skin layers in cyan, violet and pink on a deep indigo squircle — interchangeable skins for AI agents.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#201a4d"/>
      <stop offset="55%" stop-color="#251b57"/>
      <stop offset="100%" stop-color="#120f2e"/>
    </linearGradient>
    <linearGradient id="layerCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="layerViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="layerPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#05030f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="1024" height="1024" rx="232" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- Fanned skin layers (back -> front) -->
  <g filter="url(#soft)">
    <rect x="174" y="350" width="500" height="500" rx="116" fill="url(#layerCyan)"/>
    <rect x="262" y="262" width="500" height="500" rx="116" fill="url(#layerViolet)"/>
    <rect x="350" y="174" width="500" height="500" rx="116" fill="url(#layerPink)"/>
  </g>

  <!-- Glossy top sheen on the front skin -->
  <rect x="350" y="174" width="500" height="500" rx="116" fill="url(#sheen)"/>

  <!-- Crisp edge highlights -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3">
    <rect x="174" y="350" width="500" height="500" rx="116"/>
    <rect x="262" y="262" width="500" height="500" rx="116"/>
    <rect x="350" y="174" width="500" height="500" rx="116"/>
  </g>
</svg>
